<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Departures board | Waypoint Travel Planner</title><link rel="stylesheet" href="/style.css">
<meta name="csrf-token" th:content="${_csrf.token}">
<meta name="csrf-header" th:content="${_csrf.headerName}">
</head>
<body><main>
<nav class="topbar" aria-label="App navigation"><a class="wordmark" href="/">← Waypoint</a>
<div th:if="${preview}" class="account-nav"><a href="/login.html">Sign in</a><a class="button" href="/signup.html">Create account</a></div>
<form th:if="${account}" th:action="@{/logout}" method="post">
<span th:text="${account}"></span><button>Sign out</button>
</form></nav>
<header class="hero">
<h1>Departures board</h1><p>Review service status and flag affected trips for follow-up.</p></header>
<p th:if="${preview}" class="preview-note"><span class="sample-tag">Sample departures</span> Filter the board below. Sign in to refresh your feed and flag trips.</p>
<section class="controls" aria-label="Dashboard controls">
<form method="get" th:action="@{/disruptions}">
<label>Route<select name="route"><option value="">All routes</option>
<option th:each="item : ${routes}" th:value="${item}" th:text="${item}" th:selected="${item == route}"></option>
</select></label>
<label>Departure<input type="date" name="day" th:value="${day}"></label>
<label>Status<select name="status"><option value="">All statuses</option>
<option value="ON_TIME" th:selected="${status == 'ON_TIME'}">On time</option>
<option value="DELAYED" th:selected="${status == 'DELAYED'}">Delayed</option>
<option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Cancelled</option>
</select></label>
<button>Apply filters</button>
</form>
<div th:unless="${preview}" class="feed-controls">
<label>Simulated feed <select id="scenario">
<option value="BASELINE">Standard status</option>
<option value="RECOVERY">Trip TD104 recovered</option>
<option value="UNAVAILABLE">Feed unavailable</option>
</select></label>
<button id="refresh" type="button" class="secondary">Refresh feed</button>
</div>
</section>
<p id="feed-status" role="status"></p>
<div class="table-wrap"><table aria-label="Trip status">
<thead><tr><th>Trip</th><th>Route</th><th>Departure</th><th>Status</th><th>Last checked</th><th>Follow-up</th></tr></thead>
<tbody>
<tr th:each="row : ${rows}">
<td><span th:if="${preview}" th:text="${row.code}"></span><a th:unless="${preview}" th:href="@{/trips/{code}(code=${row.code})}" th:text="${row.code}"></a></td>
<td th:text="${row.route}"></td><td th:text="${row.departure}"></td>
<td><span class="badge" th:attr="data-status=${row.status}" th:text="${row.statusLabel}"></span></td>
<td th:text="${row.checkedAt}"></td><td th:text="${row.followUp ? 'Flagged' : '—'}"></td>
</tr>
<tr th:if="${rows.isEmpty()}"><td colspan="6">No trips match these filters.</td></tr>
</tbody></table></div>
</main><script src="/dashboard.js"></script></body></html>

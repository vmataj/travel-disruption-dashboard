<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Waypoint Travel Planner</title><link rel="stylesheet" href="/style.css"><script defer src="/account.js"></script></head>
<body class="account-page"><main>
<a class="back" href="/">← Back to Waypoint</a>
<div class="auth-layout"><aside class="auth-intro"><p>Waypoint Travel Planner</p><h1>Pick up where you left off</h1><p>Open your saved trips, check your itinerary, and plan with collaborators.</p></aside>
<section class="auth-card"><h2>Sign in</h2>
<form id="account-form" method="post" action="/login" data-mode="login">
<input type="hidden" name="_csrf">
<label>Username<input name="username" autocomplete="username" required ></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<button disabled>Sign in</button>
</form><p id="account-feedback" role="status"></p><p><a href="/signup.html">Create an account</a></p></section></div>
</main></body></html>
